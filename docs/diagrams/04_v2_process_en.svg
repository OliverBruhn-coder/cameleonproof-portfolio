<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" font-family="Helvetica, Arial, sans-serif"><title>CameleonProof v2: one rule area at a time</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">CameleonProof v2: one rule area at a time</text><rect x="20" y="60" width="124" height="90" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="82.0" y="101.1" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">1. Scope</text><text x="82.0" y="117.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">area sheet</text><line x1="144" y1="105" x2="161" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="162" y="60" width="124" height="90" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="224.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">2. Sources</text><text x="224.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">primary sources,</text><text x="224.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">version, SHA-256</text><line x1="286" y1="105" x2="303" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="304" y="60" width="124" height="90" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="366.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">3. Checkpoints</text><text x="366.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">each ID points</text><text x="366.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">to a source ID</text><line x1="428" y1="105" x2="445" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="446" y="60" width="124" height="90" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="508.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">4. Skill</text><text x="508.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">measuring script</text><text x="508.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">+ SKILL.md</text><line x1="570" y1="105" x2="587" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="588" y="60" width="124" height="90" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="650.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">5. Test</text><text x="650.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">clean files,</text><text x="650.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">known faults</text><line x1="712" y1="105" x2="729" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="730" y="60" width="124" height="90" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="792.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">6. Blind test</text><text x="792.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">fresh agent,</text><text x="792.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">no answer key</text><line x1="854" y1="105" x2="871" y2="105" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="872" y="60" width="124" height="90" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="934.0" y="92.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">7. Pilot</text><text x="934.0" y="109.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">real proofing</text><text x="934.0" y="125.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">tasks</text><path d="M934.0,150 L934.0,200 L650.0,200 L650.0,152" fill="none" stroke="#b3412e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-b3412e)"/><text x="792.0" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#b3412e">Every fault that slips through becomes a new test file</text><rect x="20" y="250" width="960" height="44" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="500.0" y="276.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">A fix is only done when an agent that has not seen the answer key has retested it.</text><text x="500" y="325" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675">Built so far: barcode (v2.1), net quantity and e-mark (v0.6), allergens (v0.1)</text></svg>