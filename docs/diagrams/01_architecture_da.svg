<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif"><title>CameleonProof v1: overordnet systemarkitektur</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">CameleonProof v1: overordnet systemarkitektur</text><rect x="20" y="50" width="280" height="400" rx="12" fill="#ffffff" stroke="#6b7785" stroke-width="1.4" stroke-dasharray="6 5"/><text x="34" y="72" font-size="13" font-weight="700" fill="#6b7785">Medarbejderens maskine</text><rect x="45" y="90" width="230" height="66" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="160.0" y="119.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Browser</text><text x="160.0" y="136.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">upload og gennemgang</text><rect x="45" y="230" width="230" height="66" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="160.0" y="259.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Lokal connector</text><text x="160.0" y="276.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">kun læsning, kun lokalt</text><rect x="45" y="360" width="230" height="66" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="160.0" y="389.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Bureauets filserver</text><text x="160.0" y="406.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">produktdata, fx varenummer</text><line x1="160" y1="156" x2="160" y2="228" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><text x="230" y="196" text-anchor="middle" font-size="11.5" fill="#5b6675">spørger om produktdata</text><line x1="160" y1="296" x2="160" y2="358" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="360" y="50" width="580" height="400" rx="12" fill="#ffffff" stroke="#6b7785" stroke-width="1.4" stroke-dasharray="6 5"/><text x="374" y="72" font-size="13" font-weight="700" fill="#6b7785">Server (Docker bag HTTPS)</text><rect x="385" y="90" width="250" height="66" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="510.0" y="119.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Webapplikation (FastAPI)</text><text x="510.0" y="136.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">login, adgang pr. sag</text><rect x="385" y="200" width="250" height="66" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="510.0" y="229.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Korrekturpipeline</text><text x="510.0" y="246.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">læs, kalibrér, mål, vurdér</text><rect x="670" y="90" width="245" height="56" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="792.5" y="114.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Regelkort (YAML)</text><text x="792.5" y="131.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">110 i alt, 42 aktive i fladen</text><rect x="670" y="160" width="245" height="56" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="792.5" y="184.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Kilderegister</text><text x="792.5" y="201.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">side og ordret citat</text><rect x="670" y="230" width="245" height="56" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="792.5" y="254.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Database (SQLite)</text><text x="792.5" y="271.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">sager, kørsler, fund, vurderinger</text><rect x="670" y="300" width="245" height="56" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="792.5" y="324.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Rapport</text><text x="792.5" y="341.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">JSON og HTML</text><rect x="385" y="320" width="250" height="80" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="510.0" y="347.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Claude vision</text><text x="510.0" y="364.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">kun ved 'kan ikke tjekke',</text><text x="510.0" y="381.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">højst rådgivende</text><line x1="275" y1="123" x2="383" y2="123" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><text x="326" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">PDF og produktdata</text><line x1="510" y1="156" x2="510" y2="198" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="635" y1="220" x2="668" y2="118" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="635" y1="228" x2="668" y2="188" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="635" y1="240" x2="668" y2="258" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="635" y1="250" x2="668" y2="322" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="510" y1="318" x2="510" y2="268" stroke="#b7791f" stroke-width="1.8" marker-end="url(#a-b7791f)" stroke-dasharray="5 4"/><text x="160" y="472" text-anchor="middle" font-size="11.5" font-weight="400" fill="#b3412e">serveren når aldrig filserveren</text><rect x="360" y="470" width="580" height="74" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="650.0" y="494.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">GitHub Actions</text><text x="650.0" y="511.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">2.179 testcases og regressionsbaseline,</text><text x="650.0" y="528.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">deploy kun når alt er grønt</text><line x1="650" y1="470" x2="650" y2="452" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/></svg>