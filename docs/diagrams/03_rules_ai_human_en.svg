<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" font-family="Helvetica, Arial, sans-serif"><title>How the rule engine, AI and people share the work</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">How the rule engine, AI and people share the work</text><rect x="20" y="55" width="290" height="200" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="32" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">Rule engine (plain code)</text><text x="32" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="32" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Measures barcode, digit height, distances</text><text x="32" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Compares with threshold and margin</text><text x="32" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Returns: must fix / no finding /</text><text x="32" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">cannot check</text><text x="32" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Same input, same answer</text><rect x="335" y="55" width="290" height="200" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="347" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">AI (language model)</text><text x="347" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="347" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Reads context and text</text><text x="347" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Suggests location when layout fails</text><text x="347" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">(v1: advisory at most)</text><text x="347" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Writes the report in plain language</text><text x="347" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Creates independent test variants</text><rect x="650" y="55" width="290" height="200" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="662" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">Person</text><text x="662" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="662" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Decides 'needs judgement'</text><text x="662" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Knows client agreements and exceptions</text><text x="662" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Can accept a deviation,</text><text x="662" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">but the verdict stands</text><text x="662" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Approves rules and sources</text><line x1="310" y1="155" x2="333" y2="155" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><line x1="625" y1="155" x2="648" y2="155" stroke="#b7791f" stroke-width="1.8" marker-end="url(#a-b7791f)"/><rect x="20" y="280" width="920" height="56" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="480.0" y="312.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">Only the rule engine gives a verdict. AI can suggest; a person decides what needs judgement.</text></svg>