<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif"><title>The method is chosen per task, but the quality bar is the same</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">The method is chosen per task, but the quality bar is the same</text><rect x="390" y="60" width="220" height="60" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="500.0" y="85.7" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">The best solution</text><text x="500.0" y="104.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675">for that exact spot</text><rect x="30.0" y="160" width="140" height="44" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="100.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Code</text><line x1="500" y1="120" x2="100.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="190.0" y="160" width="140" height="44" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="260.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">AI</text><line x1="500" y1="120" x2="260.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="350.0" y="160" width="140" height="44" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="420.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Tool</text><line x1="500" y1="120" x2="420.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="510.0" y="160" width="140" height="44" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="580.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Skill</text><line x1="500" y1="120" x2="580.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="670.0" y="160" width="140" height="44" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="740.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Workflow</text><line x1="500" y1="120" x2="740.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="830.0" y="160" width="140" height="44" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="900.0" y="186.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">A mix</text><line x1="500" y1="120" x2="900.0" y2="158" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><rect x="20" y="250" width="306" height="110" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="173.0" y="292.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Same quality bar</text><text x="173.0" y="309.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">A check is shown only after it has</text><text x="173.0" y="326.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">passed the three tests, whatever the method</text><rect x="347" y="250" width="306" height="110" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="500.0" y="292.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">If the answer can vary, it is a suggestion</text><text x="500.0" y="309.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">Shown as 'check this'.</text><text x="500.0" y="326.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">A person confirms</text><rect x="674" y="250" width="306" height="110" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="827.0" y="292.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Data stays where it may be</text><text x="827.0" y="309.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">Client files only go where</text><text x="827.0" y="326.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">the agency has said yes</text></svg>