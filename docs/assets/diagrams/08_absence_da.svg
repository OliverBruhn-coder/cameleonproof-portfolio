<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Helvetica, Arial, sans-serif"><title>Når noget forventet ikke er der, kræver hver forklaring sin egen handling</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">Når noget forventet ikke er der, kræver hver forklaring sin egen handling</text><rect x="20" y="60" width="178" height="140" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="109.0" y="108.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Ikke endnu</text><text x="109.0" y="125.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Forventes senere,</text><text x="109.0" y="143.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">fx i en senere</text><text x="109.0" y="161.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">korrekturrunde</text><rect x="214" y="60" width="178" height="140" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="303.0" y="116.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Andres ansvar</text><text x="303.0" y="134.7" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">En anden part</text><text x="303.0" y="152.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">står inde for det</text><rect x="408" y="60" width="178" height="140" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="497.0" y="108.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Ikke relevant</text><text x="497.0" y="125.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Hører til en</text><text x="497.0" y="143.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">anden flade.</text><text x="497.0" y="161.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Skrives med navn</text><rect x="602" y="60" width="178" height="140" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="691.0" y="108.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Mangler</text><text x="691.0" y="125.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Skal være der nu</text><text x="691.0" y="143.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">og er der ikke.</text><text x="691.0" y="161.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Fejl, hvis bevist</text><rect x="796" y="60" width="178" height="140" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="885.0" y="108.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Forkert</text><text x="885.0" y="125.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Er der, men</text><text x="885.0" y="143.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">stemmer ikke.</text><text x="885.0" y="161.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Fejl, hvis bevist</text><rect x="20" y="230" width="960" height="70" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="500.0" y="261.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">Fase og ansvar afgør tilstanden. Er de ukendte, gætter systemet ikke, men viser 'tjek'.</text><text x="500.0" y="278.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">'Kan ikke tjekke' er systemets egen blindhed, ikke en sjette tilstand.</text></svg>