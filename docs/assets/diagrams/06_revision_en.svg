<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif"><title>The audit: what it found, and what I decided</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">The audit: what it found, and what I decided</text><text x="20" y="62" text-anchor="start" font-size="11.5" font-weight="700" fill="#5b6675">CHECKED</text><text x="250" y="62" text-anchor="start" font-size="11.5" font-weight="700" fill="#5b6675">FOUND</text><text x="720" y="62" text-anchor="start" font-size="11.5" font-weight="700" fill="#5b6675">DECIDED</text><rect x="20" y="74" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="106.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">The food rules</text><text x="120.0" y="123.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">August 2026</text><rect x="250" y="74" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="106.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">5 ways an error could</text><text x="375.0" y="122.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">slip through as a pass</text><line x1="220" y1="110" x2="248" y2="110" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="110" x2="528" y2="209.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="166" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="198.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Test coverage</text><text x="120.0" y="215.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">August 2026</text><rect x="250" y="166" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="198.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">37 of 52 rules had never</text><text x="375.0" y="214.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">triggered their fail branch</text><line x1="220" y1="202" x2="248" y2="202" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="202" x2="528" y2="227.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="258" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">31 synthetic error files</text><text x="120.0" y="307.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">September 2026</text><rect x="250" y="258" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="290.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">30 of 42 rules caught the error,</text><text x="375.0" y="306.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">6 did not react</text><line x1="220" y1="294" x2="248" y2="294" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="294" x2="528" y2="245.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="350" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="382.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">All the code (AS-IS)</text><text x="120.0" y="399.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">September 2026</text><rect x="250" y="350" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="382.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">Every claim marked</text><text x="375.0" y="398.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">VERIFIED, PARTIAL or UNKNOWN</text><line x1="220" y1="386" x2="248" y2="386" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="386" x2="528" y2="263.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="530" y="186" width="160" height="100" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="610.0" y="223.4" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">The rules were better</text><text x="610.0" y="240.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">at acquitting than</text><text x="610.0" y="257.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">at convicting</text><rect x="720" y="96" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Unproven rules hidden</text><text x="850.0" y="140.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">the food rules stay hidden</text><text x="850.0" y="157.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">until they pass</text><line x1="690" y1="236" x2="718" y2="136" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="720" y="198" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="225.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">The three tests</text><text x="850.0" y="242.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">before a rule may</text><text x="850.0" y="259.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">raise a red fail</text><line x1="690" y1="236" x2="718" y2="238" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="720" y="300" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="327.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Change of direction</text><text x="850.0" y="344.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">one rule area at a time,</text><text x="850.0" y="361.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">as a skill</text><line x1="690" y1="236" x2="718" y2="340" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/></svg>