<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif"><title>Modenhed: en regel skal bevise, at den kan fange en fejl</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">Modenhed: en regel skal bevise, at den kan fange en fejl</text><rect x="20" y="230" width="200" height="120" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="268.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">SKJULT</text><text x="120.0" y="285.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Ikke valideret endnu.</text><text x="120.0" y="303.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Vises ikke. Kører kun</text><text x="120.0" y="321.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">i valideringen</text><rect x="235" y="160" width="200" height="190" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="335.0" y="224.1" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">TJEK</text><text x="335.0" y="241.9" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Ingen falske fejl, men aldrig</text><text x="335.0" y="259.7" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">set dumpe, eller kilden er</text><text x="335.0" y="277.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">ikke bekræftet. Højst</text><text x="335.0" y="295.4" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">'tjek dette', blokerer aldrig</text><rect x="450" y="90" width="200" height="260" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="550.0" y="198.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">BEVIST</text><text x="550.0" y="215.8" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Har bestået alle</text><text x="550.0" y="233.6" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">tre prøver.</text><text x="550.0" y="251.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#5b6675">Kan give en rød fejl</text><rect x="670" y="160" width="310" height="160" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.6"/><text x="682" y="210.2" text-anchor="start" font-size="13" font-weight="700" fill="#0f1b2d">De tre prøver</text><text x="682" y="227.4" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6675">1. Ingen falske røde fejl på godkendte filer</text><text x="682" y="244.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6675">2. Set dumpe mindst én gang, på en</text><text x="682" y="261.7" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6675">    rigtig eller en syntetisk fejl</text><text x="682" y="278.9" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6675">3. Fangstraten er målt</text></svg>