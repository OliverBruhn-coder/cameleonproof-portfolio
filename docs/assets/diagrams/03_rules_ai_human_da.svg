<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" font-family="Helvetica, Arial, sans-serif"><title>Samspillet mellem regelmotor, AI og menneske</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">Samspillet mellem regelmotor, AI og menneske</text><rect x="20" y="55" width="290" height="200" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="32" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">Regelmotor (almindelig kode)</text><text x="32" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="32" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Måler stregkode, cifferhøjde, afstande</text><text x="32" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Sammenligner med tærskel og margin</text><text x="32" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Giver: skal rettes / ingen fund /</text><text x="32" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">kan ikke tjekkes</text><text x="32" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Samme input giver samme svar</text><rect x="335" y="55" width="290" height="200" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="347" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">AI (sprogmodel)</text><text x="347" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="347" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Læser kontekst og tekst</text><text x="347" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Foreslår placering, når layout svigter</text><text x="347" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">(v1: højst rådgivende)</text><text x="347" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Skriver rapporten i klart sprog</text><text x="347" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Laver uafhængige testvarianter</text><rect x="650" y="55" width="290" height="200" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="662" y="104.5" text-anchor="start" font-size="14" font-weight="700" fill="#0f1b2d">Menneske</text><text x="662" y="122.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675"></text><text x="662" y="141.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Afgør 'kræver vurdering'</text><text x="662" y="159.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Kender kundeaftaler og undtagelser</text><text x="662" y="178.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Kan acceptere en afvigelse,</text><text x="662" y="196.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">men dommen står</text><text x="662" y="215.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6675">Godkender regler og kilder</text><line x1="310" y1="155" x2="333" y2="155" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><line x1="625" y1="155" x2="648" y2="155" stroke="#b7791f" stroke-width="1.8" marker-end="url(#a-b7791f)"/><rect x="20" y="280" width="920" height="56" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="480.0" y="312.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">Kun regelmotoren kan give en dom. AI kan foreslå, mennesket afgør det, der kræver skøn.</text></svg>