<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif"><title>Data flow from upload to result</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">Data flow from upload to result</text><rect x="20" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="83.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">1. Upload</text><text x="83.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">PDF hashed,</text><text x="83.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">case registered</text><line x1="146" y1="108" x2="161" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="162" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="225.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">2. Read artwork</text><text x="225.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">PDF structure,</text><text x="225.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">OCR as fallback</text><line x1="288" y1="108" x2="303" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="304" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="367.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">3. Scale</text><text x="367.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">mm from format,</text><text x="367.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">cross-check frame</text><line x1="430" y1="108" x2="445" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="446" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="509.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">4. Which rules?</text><text x="509.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">applies, does not,</text><text x="509.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">lacks evidence</text><line x1="572" y1="108" x2="587" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="588" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="651.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">5. Measure</text><text x="651.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">plain code,</text><text x="651.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">with uncertainty</text><line x1="714" y1="108" x2="729" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="730" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="793.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">6. Status per rule</text><text x="793.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">and source</text><text x="793.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">citation</text><line x1="856" y1="108" x2="871" y2="108" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><rect x="872" y="60" width="126" height="96" rx="8" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.6"/><text x="935.0" y="95.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">7. Report</text><text x="935.0" y="112.4" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">for designer and</text><text x="935.0" y="128.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">proofreader</text><rect x="588" y="200" width="126" height="64" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="651.0" y="228.3" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1b2d">AI (v1)</text><text x="651.0" y="244.1" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">only on 'cannot check'</text><line x1="651.0" y1="200" x2="651.0" y2="158" stroke="#b7791f" stroke-width="1.8" marker-end="url(#a-b7791f)" stroke-dasharray="5 4"/><rect x="20" y="300" width="230" height="64" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="135.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Must fix</text><text x="135.0" y="345.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">measured outside the requirement</text><rect x="266" y="300" width="230" height="64" rx="8" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.6"/><text x="381.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Needs judgement</text><text x="381.0" y="345.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">near the limit or uncertain</text><rect x="512" y="300" width="230" height="64" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="627.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Cannot check</text><text x="627.0" y="345.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">measurement missing, never a pass</text><rect x="758" y="300" width="230" height="64" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="873.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">No findings</text><text x="873.0" y="345.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">on the items checked</text><path d="M935.0,156 L935.0,280 L135.0,280" fill="none" stroke="#1f5f8b" stroke-width="1.8"/><line x1="135.0" y1="280" x2="135.0" y2="297" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><line x1="381.0" y1="280" x2="381.0" y2="297" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><line x1="627.0" y1="280" x2="627.0" y2="297" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><line x1="873.0" y1="280" x2="873.0" y2="297" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#a-1f5f8b)"/><text x="500" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f1b2d">A missing measurement makes the rule 'cannot check'. Never 'pass' without a measurement.</text></svg>