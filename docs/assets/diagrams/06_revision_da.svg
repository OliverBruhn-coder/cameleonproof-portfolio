troke="#b3412e" stroke-width="1.6"/><text x="375.0" y="106.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">5 måder, en fejl kunne</text><text x="375.0" y="122.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">slippe igennem som bestået</text><line x1="220" y1="110" x2="248" y2="110" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="110" x2="528" y2="209.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="166" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="198.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Testdækning</text><text x="120.0" y="215.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">august 2026</text><rect x="250" y="166" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="198.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">37 af 52 regler havde aldrig</text><text x="375.0" y="214.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">udløst deres fejlgren</text><line x1="220" y1="202" x2="248" y2="202" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="202" x2="528" y2="227.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="258" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">31 syntetiske fejlfiler</text><text x="120.0" y="307.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">september 2026</text><rect x="250" y="258" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="290.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">30 af 42 regler fangede fejlen,</text><text x="375.0" y="306.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">6 reagerede ikke</text><line x1="220" y1="294" x2="248" y2="294" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="294" x2="528" y2="245.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="20" y="350" width="200" height="72" rx="8" fill="#f1f3f6" stroke="#6b7785" stroke-width="1.6"/><text x="120.0" y="382.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Hele koden (AS-IS)</text><text x="120.0" y="399.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">september 2026</text><rect x="250" y="350" width="250" height="72" rx="8" fill="#fbe9e6" stroke="#b3412e" stroke-width="1.6"/><text x="375.0" y="382.1" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">Hvert udsagn mærket</text><text x="375.0" y="398.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">VERIFIED, PARTIAL eller UNKNOWN</text><line x1="220" y1="386" x2="248" y2="386" stroke="#6b7785" stroke-width="1.8" marker-end="url(#a-6b7785)"/><line x1="500" y1="386" x2="528" y2="263.0" stroke="#b3412e" stroke-width="1.8" marker-end="url(#a-b3412e)"/><rect x="530" y="186" width="160" height="100" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.6"/><text x="610.0" y="223.4" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">Reglerne var bedre til</text><text x="610.0" y="240.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">at frikende end til</text><text x="610.0" y="257.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">at dømme</text><rect x="720" y="96" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Ubeviste regler skjules</text><text x="850.0" y="140.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">fødevarereglerne vises ikke,</text><text x="850.0" y="157.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">før de har bestået</text><line x1="690" y1="236" x2="718" y2="136" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="720" y="198" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="225.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">De tre prøver</text><text x="850.0" y="242.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">før en regel må</text><text x="850.0" y="259.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">give en rød fejl</text><line x1="690" y1="236" x2="718" y2="238" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="720" y="300" width="260" height="80" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="850.0" y="327.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b2d">Retningsskift</text><text x="850.0" y="344.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">ét regelområde ad gangen,</text><text x="850.0" y="361.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">som en skill</text><line x1="690" y1="236" x2="718" y2="340" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/></svg>