t-anchor="middle" font-size="11.0" font-weight="400" fill="#5b6675">in three tabs</text><text x="20" y="176" text-anchor="start" font-size="11.5" font-weight="700" fill="#5b6675">TO-BE</text><rect x="20" y="188" width="220" height="60" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="130.0" y="222.6" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">Log in</text><line x1="240" y1="218" x2="265" y2="218" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="266" y="188" width="220" height="60" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="376.0" y="222.6" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">Drop the PDF</text><line x1="486" y1="218" x2="511" y2="218" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="512" y="188" width="220" height="60" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="622.0" y="222.6" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">See progress</text><line x1="732" y1="218" x2="757" y2="218" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#a-2e7d5b)"/><rect x="758" y="188" width="220" height="60" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="868.0" y="214.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1b2d">Read only what</text><text x="868.0" y="231.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6675">needs action</text><text x="500" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f1b2d">The form appears only when something is missing or in conflict. Facts are fetched by the connector on the employee's machine.</text></svg>