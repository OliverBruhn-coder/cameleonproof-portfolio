<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Helvetica, Arial, sans-serif"><title>The journey: from thesis to one skill per rule area</title><defs><marker id="a-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker><marker id="a-1f5f8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker><marker id="a-b7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="a-2e7d5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker><marker id="a-b3412e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3412e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f1b2d">The journey: from thesis to one skill per rule area</text><line x1="40" y1="175" x2="970" y2="175" stroke="#6b7785" stroke-width="2"/><circle cx="70.0" cy="175" r="7" fill="#ffffff" stroke="#1f5f8b" stroke-width="2.4"/><text x="70.0" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f8b">2025</text><text x="70.0" y="91" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Thesis on</text><text x="70.0" y="109" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">pricing. The</text><text x="70.0" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">need is spotted</text><circle cx="192.9" cy="175" r="7" fill="#ffffff" stroke="#1f5f8b" stroke-width="2.4"/><text x="192.85714285714286" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f8b">Feb 2026</text><text x="192.85714285714286" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Version 1</text><text x="192.85714285714286" y="249" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">starts as a</text><text x="192.85714285714286" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">web system</text><circle cx="315.7" cy="175" r="7" fill="#ffffff" stroke="#1f5f8b" stroke-width="2.4"/><text x="315.7142857142857" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f8b">Jul 2026</text><text x="315.7142857142857" y="91" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Scope set.</text><text x="315.7142857142857" y="109" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">The system never</text><text x="315.7142857142857" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">says 'approved'</text><circle cx="438.6" cy="175" r="7" fill="#ffffff" stroke="#b3412e" stroke-width="2.4"/><text x="438.57142857142856" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#b3412e">Aug 2026</text><text x="438.57142857142856" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Audit of the</text><text x="438.57142857142856" y="249" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">food rules:</text><text x="438.57142857142856" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">5 false passes</text><circle cx="561.4" cy="175" r="7" fill="#ffffff" stroke="#b3412e" stroke-width="2.4"/><text x="561.4285714285714" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#b3412e">Sep 2026</text><text x="561.4285714285714" y="91" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">On a server</text><text x="561.4285714285714" y="109" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">behind HTTPS.</text><text x="561.4285714285714" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">AS-IS code audit</text><circle cx="684.3" cy="175" r="7" fill="#ffffff" stroke="#1f5f8b" stroke-width="2.4"/><text x="684.2857142857143" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f8b">Oct 2026</text><text x="684.2857142857143" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Grilling:</text><text x="684.2857142857143" y="249" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">15 decisions,</text><text x="684.2857142857143" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">the three tests</text><circle cx="807.1" cy="175" r="7" fill="#ffffff" stroke="#1f5f8b" stroke-width="2.4"/><text x="807.1428571428571" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5f8b">Nov 2026</text><text x="807.1428571428571" y="91" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">TO-BE with</text><text x="807.1428571428571" y="109" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">12 modules</text><text x="807.1428571428571" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">and user journey</text><circle cx="930.0" cy="175" r="7" fill="#ffffff" stroke="#2e7d5b" stroke-width="2.4"/><text x="930.0" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d5b">21 Nov 2026</text><text x="930.0" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#0f1b2d">Change of</text><text x="930.0" y="249" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">direction: one</text><text x="930.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">skill per area</text><rect x="20" y="300" width="960" height="40" rx="8" fill="#e6f2ec" stroke="#2e7d5b" stroke-width="1.6"/><text x="500.0" y="324.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1b2d">Now: the new skills are being tried in a pilot with real proofing tasks</text></svg>